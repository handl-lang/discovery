[package]
name = "handl-discovery"
version = "0.1.0"
edition = "2024"
description = "The pure-compute legs of catopt's discovery/gauntlet machinery — bounded Cantor binding enumeration, premise-anchored derivability, the stored-composite rulecache, and the trait-driven admission gauntlet — over handl-egraph."
license = "MIT"
repository = "https://github.com/handl-lang/discovery"

# handl deps float on `main` (git). Local development resolves them to
# sibling checkouts via `source ~/.cache/devin/handl_deps.env` (git
# insteadOf) or the `[patch]` tables below — the handl-lang convention.
[dependencies]
# egraph — the saturation substrate + `Term`/`BoundEnv`/`Rewrite`
handl-egraph = { git = "https://github.com/handl-lang/egraph", branch = "main" }
# kernel — the tagged value layer (`AttrValue` <-> `TaggedValue` bridges)
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

# dev-link: begin
[patch."https://github.com/handl-lang/egraph"]
handl-egraph = { path = "../egraph" }
[patch."https://github.com/handl-lang/engine"]
hnl-engine = { path = "../engine" }
[patch."https://github.com/handl-lang/kernel"]
handl-language = { path = "../kernel/crates/handl-language" }
handl-value = { path = "../kernel/crates/handl-value" }
# dev-link: end
